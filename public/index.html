<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHoSAM HCM</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-page">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <i class="fas fa-building"></i>
          </div>
          <h1>RHoSAM HCM</h1>
          <p>Human Capital Management System</p>
        </div>
        
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">
              <i class="fas fa-envelope"></i> Email
            </label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
          </div>
          
          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock"></i> Password
            </label>
            <div class="password-input">
              <input type="password" id="password" name="password" required placeholder="Enter your password">
              <button type="button" class="toggle-password" onclick="togglePassword()">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
          
          <div class="login-footer">
            <a href="#" onclick="showForgotPassword(); return false;">Forgot Password?</a>
          </div>
        </form>
        
        <!-- Forgot Password Modal -->
        <div id="forgotPasswordModal" class="modal" style="display: none;">
          <div class="modal-content">
            <div class="modal-header">
              <h3><i class="fas fa-key"></i> Reset Password</h3>
              <button class="close-btn" onclick="hideForgotPassword()">&times;</button>
            </div>
            <div class="modal-body">
              <div id="otpStep1">
                <p>Enter your email to receive a 6-digit OTP</p>
                <div class="form-group">
                  <input type="email" id="resetEmail" placeholder="Enter your email">
                </div>
                <button class="btn btn-primary" onclick="requestOTP()">
                  <i class="fas fa-paper-plane"></i> Send OTP
                </button>
              </div>
              <div id="otpStep2" style="display: none;">
                <p>Enter the 6-digit OTP sent to your email</p>
                <div class="form-group">
                  <input type="text" id="otpCode" maxlength="6" placeholder="Enter 6-digit OTP">
                </div>
                <div class="form-group">
                  <input type="password" id="newPassword" placeholder="Enter new password">
                </div>
                <button class="btn btn-primary" onclick="resetPassword()">
                  <i class="fas fa-check"></i> Reset Password
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="appContainer" class="app-container" style="display: none;">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="fas fa-building"></i>
          <span>RHoSAM</span>
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()">
          <i class="fas fa-bars"></i>
        </button>
      </div>
      
      <ul class="sidebar-menu" id="sidebarMenu">
        <!-- Dynamic menu items will be inserted here -->
      </ul>
      
      <div class="sidebar-footer">
        <div class="user-info">
          <img id="userAvatar" src="/default-avatar.png" alt="Avatar" class="avatar">
          <div class="user-details">
            <span id="userName">User</span>
            <span id="userRole">Role</span>
          </div>
        </div>
        <button class="btn btn-logout" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="mainContent" class="main-content">
      <header class="top-bar">
        <div class="page-title">
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="top-bar-actions">
          <div class="search-box" onclick="toggleGlobalSearch()" style="cursor:pointer;">
            <i class="fas fa-search"></i>
            <span style="font-size:13px;color:var(--gray-500);">Search... <kbd style="background:var(--gray-200);padding:1px 5px;border-radius:3px;font-size:11px;">Ctrl+K</kbd></span>
          </div>
          <div id="darkModeToggle" class="notifications" onclick="toggleDarkMode()" style="cursor:pointer;">
            <i class="fas fa-moon"></i>
          </div>
          <div class="notifications" onclick="showNotifications()">
            <i class="fas fa-bell"></i>
            <span id="notifCount" class="badge">0</span>
          </div>
          <div class="user-avatar-topbar" onclick="navigateTo('profile')">
            <img id="topBarAvatar" src="/default-avatar.png" alt="Avatar" class="avatar">
            <span id="topBarUserName" style="font-size: 14px; font-weight: 500; margin-left: 8px;"></span>
          </div>
        </div>
      </header>
      
      <div id="contentArea" class="content-area">
        <!-- Dynamic content will be loaded here -->
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modalContainer" class="modal" style="display: none;">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="modalTitle">Modal Title</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Dynamic modal content -->
      </div>
    </div>
  </div>

  <!-- Global Search Overlay (Ctrl+K) -->
  <div id="globalSearchOverlay" class="global-search-overlay" style="display:none;">
    <div class="global-search-modal">
      <div class="global-search-header">
        <i class="fas fa-search" style="color:var(--gray-400);"></i>
        <input type="text" id="globalSearchInput" placeholder="Search employees, pages, courses... (Ctrl+K)" oninput="handleGlobalSearch(this.value)" autofocus>
        <kbd style="background:var(--gray-100);padding:2px 6px;border-radius:4px;font-size:11px;color:var(--gray-500);">ESC</kbd>
      </div>
      <div id="globalSearchResults" class="global-search-results">
        <div style="padding:16px;color:var(--gray-500);text-align:center;">Type to search...</div>
      </div>
    </div>
  </div>

  <!-- Quick Actions FAB -->
  <div id="quickActionsFab" class="quick-actions-fab" onclick="toggleQuickActions()">
    <i class="fas fa-plus"></i>
  </div>
  <div id="quickActionsMenu" class="quick-actions-menu" style="display:none;">
    <div class="quick-action-item" onclick="toggleQuickActions(); showCreateEmployee()"><i class="fas fa-user-plus"></i> Add Employee</div>
    <div class="quick-action-item" onclick="toggleQuickActions(); navigateTo('leave')"><i class="fas fa-calendar-plus"></i> Apply Leave</div>
    <div class="quick-action-item" onclick="toggleQuickActions(); navigateTo('chat')"><i class="fas fa-comments"></i> Open Chat</div>
    <div class="quick-action-item" onclick="toggleQuickActions(); toggleGlobalSearch()"><i class="fas fa-search"></i> Search</div>
    <div class="quick-action-item" onclick="toggleQuickActions(); navigateTo('reports')"><i class="fas fa-chart-bar"></i> Reports</div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
